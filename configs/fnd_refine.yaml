# FND sub-degree refinement: 3-point parabola (Paper C) vs global |sin| fit (Gabe's CFND).
# Replaces run_gabe_vs_parabolic_full_suite_v1_0.py + plot_gabe_benchmark_suite_v1_0.py.
# Both refinements reuse the same loss curve per trial, so FND is computed once.
name: fnd_refine
seed: 3
sweep:
  pitch_mm: [150, 50, 5]
  N: [100, 500, 1000, 5000, 10000, 50000]          # capacity part
  n_total: [500, 1000, 5000, 10000, 50000, 100000] # exposure part
  K: 25
methods:
  centroid_disc: {type: centroid, discrete: true}
  fnd_parab:     {type: fnd, scan: [-180, 179, 1], refine: parabolic}
  fnd_sine:      {type: fnd, scan: [-180, 179, 1], refine: sine}
plots:
  - {figure: capacity, methods: [fnd_parab, fnd_sine], ref: centroid_disc}
  - {figure: exposure, methods: [fnd_parab, fnd_sine], ref: centroid_disc}
  - {figure: pair, a: fnd_parab, b: fnd_sine, N: 10000}
